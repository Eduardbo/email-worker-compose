volumes:
  dados:

networks:
  banco:
  web:
  fila:
services:
  db:
    image: postgres:9.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres            
      POSTGRES_DB: email_sender             
    ports:
      - "5432:5432"                      #opcional
    volumes:
      #volumes dos dados
      - dados:/var/lib/postgresql/data
      #script
      - ./scripts:/scripts
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - banco
  frontend:
    image: nginx:1.13
    volumes:
      # Página web
      - ./web:/usr/share/nginx/html
      # Configuração do Proxy Reverso    # Localização padrão do container do nginx
      - ./nginx/default.config:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
    networks:
      - web
    depends_on:
      - app
  app:
    build: ./app
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes: #aplicação
      - ./app:/app
    working_dir: /app
    command: bash ./app.sh
    networks:
    - banco
    - web
    - fila
    depends_on:
    - db
    - queue
    environment:
      - DB_NAME=email_sender
  queue:
    image: redis:3.2
    networks:
    - fila
  workers:
    build: ./worker
    volumes:
      - ./worker:/worker
    working_dir: /worker
    command: ["python", "-u", "worker.py"]
    networks:
      - fila
    depends_on:
      - queue
      - app